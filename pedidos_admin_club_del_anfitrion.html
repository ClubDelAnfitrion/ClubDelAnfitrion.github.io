<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos internos — Club del Anfitrión</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{"wine-black":"#140b0c","wine-dark":"#1e1114","wine-panel":"#26161a","burgundy":"#5c1128","garnet":"#7c1f2f","garnet-light":"#9c3244","gold":"#c9a24b","gold-soft":"#e6cf9c","cream":"#efe6d8","stone":"#b4a293"},fontFamily:{display:['Georgia','serif'],sans:['Inter','sans-serif']}}}};
</script>
<style>
body{background:#140b0c;background-image:radial-gradient(ellipse 90% 60% at 15% -10%,rgba(124,31,47,.35),transparent 60%);min-height:100vh}
input:focus,button:focus-visible{outline:2px solid #c9a24b;outline-offset:2px}
</style>
</head>
<body class="font-sans text-cream antialiased">
<header class="border-b border-gold/20 bg-wine-black/80">
  <div class="max-w-6xl mx-auto px-5 py-5 flex items-center justify-between gap-4">
    <div><p class="text-gold-soft text-sm italic">Club del Anfitrión</p><h1 class="font-display text-2xl">Gestión interna de pedidos</h1></div>
    <a href="index.html" class="text-sm text-stone hover:text-gold-soft">Volver al sitio ↗</a>
  </div>
</header>
<main class="max-w-6xl mx-auto px-5 py-10">
  <section id="login-box" class="max-w-md mx-auto rounded-2xl border border-gold/20 bg-wine-panel p-7">
    <p class="text-gold-soft italic mb-1">Acceso restringido</p><h2 class="font-display text-2xl mb-5">Ingresar al sistema</h2>
    <form id="login-form" class="space-y-4">
      <label class="block text-sm text-stone">Correo del negocio<input id="email" type="email" required autocomplete="username" class="mt-1 w-full rounded-lg bg-wine-black border border-gold/20 px-4 py-3 text-cream"></label>
      <label class="block text-sm text-stone">Contraseña<input id="password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-lg bg-wine-black border border-gold/20 px-4 py-3 text-cream"></label>
      <button class="w-full rounded-full bg-gold px-5 py-3 text-wine-black font-semibold">Ingresar</button>
    </form>
    <p id="login-message" class="text-sm text-gold-soft mt-4" role="status"></p>
  </section>
  <section id="orders-box" class="hidden">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div><h2 class="font-display text-3xl">Solicitudes de compra</h2><p id="signed-user" class="text-stone text-sm mt-1"></p></div>
      <button id="logout-btn" class="self-start rounded-full border border-gold/40 px-5 py-2 text-gold-soft">Cerrar sesión</button>
    </div>
    <div class="rounded-2xl border border-gold/20 bg-wine-panel p-4 sm:p-6">
      <div class="flex flex-col sm:flex-row gap-3 mb-5">
        <input id="search" type="search" placeholder="Buscar por DNI, nombre o código..." class="flex-1 rounded-lg bg-wine-black/60 border border-gold/20 px-4 py-3 text-cream">
        <button id="refresh-btn" class="rounded-full bg-gold px-5 py-3 text-wine-black font-medium">Actualizar</button>
      </div>
      <p id="orders-message" class="text-stone text-sm mb-3"></p>
      <div id="orders-list" class="space-y-3"></div>
    </div>
  </section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyALsNxhMyC-GSQULpcj3CpwbDr81alvC0M",authDomain:"clubdelanfitrion-8a6f1.firebaseapp.com",projectId:"clubdelanfitrion-8a6f1",storageBucket:"clubdelanfitrion-8a6f1.firebasestorage.app",messagingSenderId:"187086724994",appId:"1:187086724994:web:59e14efb3c355bd794b99b",measurementId:"G-2DN0H1022S"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
// IMPORTANTE: reemplazá este valor por el correo real del negocio.
// La protección definitiva también debe aplicarse en las reglas de Firestore.
const ADMIN_EMAILS=["REEMPLAZAR_POR_CORREO_DEL_NEGOCIO"];
const loginBox=document.getElementById("login-box"),ordersBox=document.getElementById("orders-box"),loginMessage=document.getElementById("login-message"),ordersMessage=document.getElementById("orders-message");
let allOrders=[];
function money(n){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(Number(n)||0)}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function loadOrders(){
  ordersMessage.textContent="Cargando pedidos…";
  try{
    const snap=await getDocs(collection(db,"pedidos"));
    allOrders=snap.docs.map(d=>({id:d.id,...d.data()})).filter(o=>o.estado==="no retirado");
    renderOrders();
  }catch(e){ordersMessage.textContent="No se pudieron leer los pedidos. Verificá las reglas de seguridad de Firestore y los permisos de administrador."}
}
function renderOrders(){
  const term=document.getElementById("search").value.trim().toLowerCase();
  const filtered=allOrders.filter(o=>!term||String(o.dni||"").toLowerCase().includes(term)||String(o.nombre||"").toLowerCase().includes(term)||String(o.codigoRetiro||"").toLowerCase().includes(term));
  const list=document.getElementById("orders-list");list.replaceChildren();
  ordersMessage.textContent=filtered.length?`${filtered.length} pedido(s) pendiente(s).`:"No hay pedidos pendientes que coincidan.";
  filtered.forEach(o=>{
    const card=document.createElement("article");card.className="rounded-xl border border-gold/15 bg-wine-black/40 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4";
    card.innerHTML=`<div><p class="font-semibold text-cream">Código: ${escapeHtml(o.codigoRetiro)} — ${escapeHtml(o.nombre)}</p><p class="text-stone text-sm">DNI: ${escapeHtml(o.dni)} · Total: ${money(o.total)}</p><p class="text-stone text-xs mt-1">Pago: ${escapeHtml(o.metodoPago)}</p></div><button class="mark-btn rounded-full bg-gold px-4 py-2 text-sm font-medium text-wine-black">Marcar retirado</button>`;
    card.querySelector("button").addEventListener("click",async()=>{
      const btn=card.querySelector("button");btn.disabled=true;btn.textContent="Guardando…";
      try{await updateDoc(doc(db,"pedidos",o.id),{estado:"retirado"});allOrders=allOrders.filter(x=>x.id!==o.id);renderOrders()}
      catch(e){btn.disabled=false;btn.textContent="Marcar retirado";ordersMessage.textContent="No se pudo actualizar el pedido. Revisá los permisos de Firestore."}
    });
    list.appendChild(card);
  });
}
document.getElementById("login-form").addEventListener("submit",async e=>{e.preventDefault();loginMessage.textContent="Ingresando…";try{await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("password").value)}catch(err){loginMessage.textContent="No se pudo iniciar sesión. Revisá el correo y la contraseña."}});
document.getElementById("logout-btn").addEventListener("click",()=>signOut(auth));
document.getElementById("refresh-btn").addEventListener("click",loadOrders);
document.getElementById("search").addEventListener("input",renderOrders);
onAuthStateChanged(auth,async user=>{
  if(user){
    if(!ADMIN_EMAILS.includes(String(user.email||"").toLowerCase())){
      loginMessage.textContent="Esta cuenta no está autorizada para ver los pedidos. Configurá el correo autorizado del negocio.";
      await signOut(auth);
      return;
    }
    loginBox.classList.add("hidden");ordersBox.classList.remove("hidden");document.getElementById("signed-user").textContent=`Sesión: ${user.email||user.displayName||"usuario"}`;loadOrders()
  }else{ordersBox.classList.add("hidden");loginBox.classList.remove("hidden");allOrders=[]}
});
</script>
</body>
</html>
